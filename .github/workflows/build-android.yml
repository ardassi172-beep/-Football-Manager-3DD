name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug Android build/Football_Manager_3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Football-Manager-3D-Android
          path: build/Football_Manager_3D.apk
          if-no-files-found: error
