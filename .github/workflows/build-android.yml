name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -oq /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Android SDK and Java
        run: |
          SDK_JAR="$(find / -path '*/platforms/android-*/android.jar' -print -quit 2>/dev/null)"
          test -n "$SDK_JAR"
          SDK_DIR="$(dirname "$(dirname "$(dirname "$SDK_JAR")")")"
          JAVA_BIN="$(readlink -f "$(command -v java)")"
          JAVA_DIR="$(dirname "$(dirname "$JAVA_BIN")")"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK_DIR"
          export/android/java_sdk_path = "$JAVA_DIR"
          EOF
          echo "SDK=$SDK_DIR JAVA=$JAVA_DIR"
          ls -la "$SDK_DIR/build-tools" "$SDK_DIR/platforms"
      - name: Configure signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          sed -i "s|\$HOME/.android/debug.keystore|$HOME/.android/debug.keystore|g" export_presets.cfg
      - name: Validate and export
        run: |
          mkdir -p build
          godot --headless --editor --path . --quit --verbose 2>&1 | tee import.log
          godot --headless --path . --export-debug Android build/Football_Manager_3D.apk --verbose 2>&1 | tee export.log
          test -s build/Football_Manager_3D.apk
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            import.log
            export.log
            ~/.config/godot/editor_settings-4.tres
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Football-Manager-3D-Android
          path: build/Football_Manager_3D.apk
